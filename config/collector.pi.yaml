# Collector configuration: RASPBERRY PI profile (real Grove sensors).
# Credentials are NOT here: they come from .env (MQTT_COLLECTOR_USER / MQTT_COLLECTOR_PASSWORD).

timezone: Europe/Lisbon

# Default 5 minutes. Lower it (e.g. 60) here or with --interval; stale
# detection follows automatically: 300 s x 2.5 = 750 s (12.5 minutes).
interval_seconds: 300
stale_after_factor: 2.5

mqtt:
  host: localhost          # broker on the same Pi; override with MQTT_HOST
  port: 1883
  client_id: attic-hydro-collector
  discovery_prefix: homeassistant
  base_topic: attic/hydroponics
  device_id: attic_hydro

device:
  name: Attic Hydroponics
  model: Raspberry Pi 4 + 2 Grove SHT3x (TCA9548A hub)

logging:
  level: INFO
  file: logs/collector.log
  max_bytes: 1000000
  backup_count: 5

overrides_file: runtime/overrides.json

# Two identical SHT3x sensors (both at 0x44) behind a TCA9548A hub at 0x70.
# The hub port decides which is which:
#   port 6 -> inside the grow box   (air_temperature, humidity)
#   port 7 -> attic, outside the box (attic_temperature, attic_humidity)
# Found with the channel scan in docs/REAL_SENSORS.md, part 7.

sensors:
  air_temperature:
    type: grove                # Sensirion SHT3x, see collector/sensors/grove.py
    name: Air temperature
    device_class: temperature
    unit: "°C"
    precision: 1
    valid_range: [-10, 60]
    options:
      model: sht3x
      quantity: temperature
      bus: 1                   # /dev/i2c-1
      address: 0x44
      mux_address: 0x70        # the hub (i2cdetect -y 1 shows 70)
      mux_channel: 6           # inside the box

  humidity:
    type: grove
    name: Humidity
    device_class: humidity
    unit: "%"
    precision: 1
    valid_range: [0, 100]
    options:                   # same chip as air_temperature: read once per cycle
      model: sht3x
      quantity: humidity
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 6

  attic_temperature:
    type: grove
    name: Attic temperature
    device_class: temperature
    unit: "°C"
    precision: 1
    valid_range: [-10, 60]
    options:
      model: sht3x
      quantity: temperature
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 7           # attic, outside the box

  attic_humidity:
    type: grove
    name: Attic humidity
    device_class: humidity
    unit: "%"
    precision: 1
    valid_range: [0, 100]
    options:                   # same chip as attic_temperature
      model: sht3x
      quantity: humidity
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 7

  # No hardware yet (Phase 2): stays simulated. Set enabled: false to hide it.
  reservoir_level:
    type: simulated
    enabled: true
    name: Reservoir level
    unit: "%"
    icon: mdi:water-percent
    precision: 0
    valid_range: [0, 100]
    options:
      start: 80.0
      drain_per_hour: 1.5
      refill_below: 30.0
      refill_to: 95.0
      noise: 0.2
