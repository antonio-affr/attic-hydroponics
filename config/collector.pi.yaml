# Collector configuration: RASPBERRY PI profile (real Grove sensors).
# Credentials are NOT here: they come from .env (MQTT_COLLECTOR_USER / MQTT_COLLECTOR_PASSWORD).

timezone: Europe/Lisbon

# Default 5 minutes. Lower it (e.g. 60) here or with --interval; stale
# detection follows automatically: 300 s x 2.5 = 750 s (12.5 minutes).
interval_seconds: 300
stale_after_factor: 2.5

mqtt:
  host: localhost          # broker on the same Pi; override with MQTT_HOST
  port: 1883
  client_id: attic-hydro-collector
  discovery_prefix: homeassistant
  base_topic: attic/hydroponics
  device_id: attic_hydro

device:
  name: Attic Hydroponics
  model: Raspberry Pi 4 + 2 Grove SHT3x (TCA9548A hub) + Arduino Nano hub

logging:
  level: INFO
  file: logs/collector.log
  max_bytes: 1000000
  backup_count: 5

overrides_file: runtime/overrides.json

# Two identical SHT3x sensors (both at 0x44) behind a TCA9548A hub at 0x70.
# The hub port decides which is which:
#   port 6 -> inside the grow box   (air_temperature, humidity)
#   port 7 -> attic, outside the box (attic_temperature, attic_humidity)
# Found with the channel scan in docs/REAL_SENSORS.md, part 7.

sensors:
  air_temperature:
    type: grove                # Sensirion SHT3x, see collector/sensors/grove.py
    name: Air temperature
    device_class: temperature
    unit: "°C"
    precision: 1
    valid_range: [-10, 60]
    options:
      model: sht3x
      quantity: temperature
      bus: 1                   # /dev/i2c-1
      address: 0x44
      mux_address: 0x70        # the hub (i2cdetect -y 1 shows 70)
      mux_channel: 6           # inside the box

  humidity:
    type: grove
    name: Humidity
    device_class: humidity
    unit: "%"
    precision: 1
    valid_range: [0, 100]
    options:                   # same chip as air_temperature: read once per cycle
      model: sht3x
      quantity: humidity
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 6

  attic_temperature:
    type: grove
    name: Attic temperature
    device_class: temperature
    unit: "°C"
    precision: 1
    valid_range: [-10, 60]
    options:
      model: sht3x
      quantity: temperature
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 7           # attic, outside the box

  attic_humidity:
    type: grove
    name: Attic humidity
    device_class: humidity
    unit: "%"
    precision: 1
    valid_range: [0, 100]
    options:                   # same chip as attic_temperature
      model: sht3x
      quantity: humidity
      bus: 1
      address: 0x44
      mux_address: 0x70
      mux_channel: 7

  # No hardware yet (Phase 2): stays simulated. Set enabled: false to hide it.
  reservoir_level:
    type: simulated
    enabled: true
    name: Reservoir level
    unit: "%"
    icon: mdi:water-percent
    precision: 0
    valid_range: [0, 100]
    options:
      start: 80.0
      drain_per_hour: 1.5
      refill_below: 30.0
      refill_to: 95.0
      noise: 0.2

  # --- Arduino Nano sensor hub (nano/attic_nano/, wiring in docs/WIRING.md) ---
  # The Nano on any of the Pi's USB ports; the by-id name survives replugging.
  # A sensor the Nano reports as null (loose wire) or a silent Nano is not
  # published, so Home Assistant marks it stale. Light 1/2/3 were identified
  # with a torch on 2026-11-19 (closest to farthest).
  tray2grow_1_illuminance:
    type: nano
    name: Tray2Grow 1 illuminance
    device_class: illuminance
    unit: lx
    precision: 0
    valid_range: [0, 70000]    # BH1750 tops out at 65535 / 1.2 = 54612 lx
    options:
      port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_*"
      field: light_1_lux       # light 1: A4/A5

  tray2grow_2_illuminance:
    type: nano
    name: Tray2Grow 2 illuminance
    device_class: illuminance
    unit: lx
    precision: 0
    valid_range: [0, 70000]
    options:
      port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_*"
      field: light_2_lux       # light 2: D2/D3

  grow_area_3_illuminance:
    type: nano
    name: Grow area 3 illuminance
    device_class: illuminance
    unit: lx
    precision: 0
    valid_range: [0, 70000]
    options:
      port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_*"
      field: light_3_lux       # light 3: D5/D6

  water_temperature:
    type: nano
    name: Water temperature
    device_class: temperature
    unit: "°C"
    precision: 1
    valid_range: [0, 50]
    options:
      port: "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_*"
      field: water_temperature_c   # DS18B20 on D4

# Raspberry Pi Camera Module 3 NoIR on the CAMERA ribbon connector.
# NoIR = no infrared filter: colours look pinkish in daylight and under grow
# lights; that is expected. See collector/camera.py.
camera:
  enabled: true
  interval_seconds: 600    # one photo every 10 minutes
  width: 1920
  height: 1080
  keep_days: 7             # photos/<date>/ folders; about 45 MB a day
  photos_dir: photos
  rotation: 180            # mounted upside down in the attic (2026-11-13); 0 = as is
