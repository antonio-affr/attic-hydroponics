# Mosquitto 2 broker for attic hydroponics.
# Paths are inside the container; docker-compose.yml maps them to ./mosquitto/.

# Keep retained messages (e.g. MQTT Discovery configs) across restarts.
persistence true
persistence_location /mosquitto/data/

# Log to a file (for later reading) and to stdout (for `docker compose logs`).
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Mosquitto 2 has no listener unless one is declared explicitly.
listener 1883

# Authentication from day one: no anonymous clients, users from the password file.
allow_anonymous false
password_file /mosquitto/config/passwd
