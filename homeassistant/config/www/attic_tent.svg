<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 890" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background for the "Tent" card on the Attic Hydroponics dashboard.
       Live values are placed on top by the picture-elements card, by percentage:
       left = x / 600, top = y / 890. Move an element here, move it there too. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a1f"/>
      <stop offset="1" stop-color="#0b1013"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b252c"/>
      <stop offset="1" stop-color="#141c21"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd0ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d5f86" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffc928"/>
    </linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a38"/>
      <stop offset="1" stop-color="#1f3226"/>
    </linearGradient>
    <linearGradient id="duct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4850"/>
      <stop offset="0.5" stop-color="#5b6b74"/>
      <stop offset="1" stop-color="#3a4850"/>
    </linearGradient>
    <filter id="bloom" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="sprout">
      <path d="M0 0 V-16" stroke="#5fcf7a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 -12 C -10 -14 -13 -21 -12 -24 C -5 -23 -1 -18 0 -12 Z" fill="#6fe08b"/>
      <path d="M0 -15 C 9 -17 12 -24 11 -27 C 4 -26 1 -21 0 -15 Z" fill="#4fbf6c"/>
    </g>
  </defs>

  <!-- Card background -->
  <rect width="600" height="890" rx="20" fill="url(#bg)"/>

  <!-- Attic, outside the tent -->
  <text x="44" y="51" font-size="17" font-weight="700" letter-spacing="2.5" fill="#7f8f98">ATTIC · OUTSIDE</text>

  <!-- Tent: body, dot grid, legs -->
  <rect x="40" y="80" width="520" height="770" rx="18" fill="url(#tent)" stroke="#33434c" stroke-width="2.5"/>
  <rect x="40" y="80" width="520" height="770" rx="18" fill="url(#dots)"/>
  <rect x="62" y="850" width="12" height="18" rx="4" fill="#33434c"/>
  <rect x="526" y="850" width="12" height="18" rx="4" fill="#33434c"/>

  <!-- Shelves -->
  <g stroke="#2c3a42" stroke-width="2">
    <line x1="42" y1="300" x2="558" y2="300"/>
    <line x1="42" y1="460" x2="558" y2="460"/>
    <line x1="42" y1="655" x2="558" y2="655"/>
  </g>

  <!-- Top shelf: water tanks -->
  <g>
    <rect x="75" y="125" width="150" height="170" rx="14" fill="#1a262d" stroke="#3b4d57" stroke-width="2.5"/>
    <path d="M78 212 Q 114 202 150 212 T 222 212 V 280 Q 222 292 210 292 H 90 Q 78 292 78 280 Z" fill="url(#water)"/>
    <text x="150" y="158" font-size="17" font-weight="700" letter-spacing="2" fill="#cfdbe0" text-anchor="middle">TANK 1</text>

    <rect x="245" y="125" width="150" height="170" rx="14" fill="#1a262d" stroke="#3b4d57" stroke-width="2.5"/>
    <path d="M248 212 Q 284 202 320 212 T 392 212 V 280 Q 392 292 380 292 H 260 Q 248 292 248 280 Z" fill="url(#water)"/>
    <text x="320" y="158" font-size="17" font-weight="700" letter-spacing="2" fill="#cfdbe0" text-anchor="middle">TANK 2</text>
  </g>

  <!-- Top shelf: T4 fan and its duct -->
  <rect x="463" y="82" width="34" height="74" fill="url(#duct)"/>
  <g stroke="#2a353b" stroke-width="2">
    <line x1="463" y1="100" x2="497" y2="100"/>
    <line x1="463" y1="118" x2="497" y2="118"/>
    <line x1="463" y1="136" x2="497" y2="136"/>
  </g>
  <circle cx="480" cy="205" r="52" fill="#1a262d" stroke="#3b4d57" stroke-width="2.5"/>
  <circle cx="480" cy="205" r="42" fill="none" stroke="#2c3a42" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="480" y="286" font-size="15" font-weight="700" letter-spacing="2" fill="#cfdbe0" text-anchor="middle">T4 FAN</text>

  <!-- Light 1, its cone, tray 1 -->
  <polygon points="90,324 470,324 505,428 75,428" fill="url(#cone)"/>
  <rect x="90" y="312" width="380" height="12" rx="6" fill="#ffd54a" filter="url(#bloom)" opacity="0.8"/>
  <rect x="90" y="312" width="380" height="12" rx="6" fill="url(#bar)"/>
  <text x="480" y="323" font-size="14" font-weight="700" letter-spacing="1.5" fill="#d9b23a">LIGHT 1</text>
  <text x="300" y="352" font-size="14" font-weight="700" letter-spacing="2" fill="#7f8f98" text-anchor="middle">BOX SENSOR</text>
  <g>
    <use href="#sprout" x="125" y="428"/><use href="#sprout" x="205" y="428"/>
    <use href="#sprout" x="290" y="428"/><use href="#sprout" x="375" y="428"/>
    <use href="#sprout" x="455" y="428"/>
  </g>
  <rect x="75" y="428" width="430" height="28" rx="8" fill="url(#tray)" stroke="#4b7a5a" stroke-width="2"/>
  <text x="92" y="447" font-size="14" font-weight="700" letter-spacing="2" fill="#b7e6c4">TRAY2GROW 1</text>

  <!-- Light 2, its cone, tray 2 -->
  <polygon points="90,484 470,484 505,623 75,623" fill="url(#cone)"/>
  <rect x="90" y="472" width="380" height="12" rx="6" fill="#ffd54a" filter="url(#bloom)" opacity="0.8"/>
  <rect x="90" y="472" width="380" height="12" rx="6" fill="url(#bar)"/>
  <text x="480" y="483" font-size="14" font-weight="700" letter-spacing="1.5" fill="#d9b23a">LIGHT 2</text>
  <text x="300" y="530" font-size="14" font-weight="700" letter-spacing="2" fill="#7f8f98" text-anchor="middle">T4 CONTROLLER PROBE</text>
  <g>
    <use href="#sprout" x="125" y="623"/><use href="#sprout" x="205" y="623"/>
    <use href="#sprout" x="290" y="623"/><use href="#sprout" x="375" y="623"/>
    <use href="#sprout" x="455" y="623"/>
  </g>
  <rect x="75" y="623" width="430" height="28" rx="8" fill="url(#tray)" stroke="#4b7a5a" stroke-width="2"/>
  <text x="92" y="642" font-size="14" font-weight="700" letter-spacing="2" fill="#b7e6c4">TRAY2GROW 2</text>

  <!-- Grow area 3, on the floor -->
  <g>
    <use href="#sprout" x="125" y="815"/><use href="#sprout" x="205" y="815"/>
    <use href="#sprout" x="290" y="815"/><use href="#sprout" x="375" y="815"/>
    <use href="#sprout" x="455" y="815"/>
  </g>
  <rect x="75" y="815" width="430" height="28" rx="8" fill="url(#tray)" stroke="#4b7a5a" stroke-width="2"/>
  <text x="92" y="834" font-size="14" font-weight="700" letter-spacing="2" fill="#b7e6c4">GROW AREA 3</text>
</svg>
