<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 890" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background for the "Tent" card on the Attic Hydroponics dashboard.
       Live values are placed on top by the picture-elements card, by percentage:
       left = x / 600, top = y / 890. Move an element here, move it there too. -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd3f0"/>
      <stop offset="1" stop-color="#5aa9d6"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="600" height="890" rx="16" fill="#eef1ec"/>

  <!-- Attic, outside the tent -->
  <text x="40" y="50" font-size="17" font-weight="600" fill="#55625a">Attic, outside</text>

  <!-- Tent frame and legs -->
  <rect x="40" y="80" width="520" height="770" rx="6" fill="#fbfcfa" stroke="#2f3a33" stroke-width="5"/>
  <rect x="44" y="850" width="14" height="22" rx="4" fill="#2f3a33"/>
  <rect x="542" y="850" width="14" height="22" rx="4" fill="#2f3a33"/>

  <!-- Shelves -->
  <line x1="42" y1="300" x2="558" y2="300" stroke="#8a948d" stroke-width="3"/>
  <line x1="42" y1="460" x2="558" y2="460" stroke="#8a948d" stroke-width="3"/>
  <line x1="42" y1="655" x2="558" y2="655" stroke="#8a948d" stroke-width="3"/>

  <!-- Top shelf: water tanks -->
  <rect x="75" y="125" width="150" height="170" rx="8" fill="#ffffff" stroke="#2f3a33" stroke-width="4"/>
  <rect x="79" y="200" width="142" height="91" rx="4" fill="url(#water)" opacity="0.55"/>
  <text x="150" y="152" font-size="17" font-weight="600" fill="#2f3a33" text-anchor="middle">Tank 1</text>

  <rect x="245" y="125" width="150" height="170" rx="8" fill="#ffffff" stroke="#2f3a33" stroke-width="4"/>
  <rect x="249" y="200" width="142" height="91" rx="4" fill="url(#water)" opacity="0.55"/>
  <text x="320" y="152" font-size="17" font-weight="600" fill="#2f3a33" text-anchor="middle">Tank 2</text>

  <!-- Top shelf: T4 fan and its duct -->
  <rect x="462" y="84" width="36" height="70" fill="#d9dedb" stroke="#2f3a33" stroke-width="3"/>
  <line x1="462" y1="102" x2="498" y2="102" stroke="#2f3a33" stroke-width="1.5"/>
  <line x1="462" y1="120" x2="498" y2="120" stroke="#2f3a33" stroke-width="1.5"/>
  <line x1="462" y1="138" x2="498" y2="138" stroke="#2f3a33" stroke-width="1.5"/>
  <circle cx="480" cy="205" r="50" fill="#ffffff" stroke="#2f3a33" stroke-width="4"/>
  <text x="480" y="290" font-size="15" font-weight="600" fill="#2f3a33" text-anchor="middle">T4 fan</text>

  <!-- Light 1 and Tray2Grow 1 -->
  <rect x="90" y="312" width="380" height="12" rx="6" fill="#f5cf3a" stroke="#b8961c" stroke-width="2"/>
  <rect x="90" y="324" width="380" height="60" fill="url(#glow)"/>
  <text x="482" y="323" font-size="13" fill="#8a7414">Light 1</text>
  <rect x="75" y="428" width="430" height="28" rx="5" fill="#d8c8b0" stroke="#2f3a33" stroke-width="3"/>
  <text x="290" y="448" font-size="15" font-weight="600" fill="#2f3a33" text-anchor="middle">Tray2Grow 1</text>

  <!-- Light 2 and Tray2Grow 2 -->
  <rect x="90" y="472" width="380" height="12" rx="6" fill="#f5cf3a" stroke="#b8961c" stroke-width="2"/>
  <rect x="90" y="484" width="380" height="60" fill="url(#glow)"/>
  <text x="482" y="483" font-size="13" fill="#8a7414">Light 2</text>
  <rect x="75" y="623" width="430" height="28" rx="5" fill="#d8c8b0" stroke="#2f3a33" stroke-width="3"/>
  <text x="290" y="643" font-size="15" font-weight="600" fill="#2f3a33" text-anchor="middle">Tray2Grow 2</text>

  <!-- Grow area 3, on the floor -->
  <rect x="75" y="815" width="430" height="28" rx="5" fill="#d8c8b0" stroke="#2f3a33" stroke-width="3"/>
  <text x="290" y="835" font-size="15" font-weight="600" fill="#2f3a33" text-anchor="middle">Grow area 3</text>

  <!-- Captions for the two climate readouts -->
  <text x="300" y="368" font-size="13" fill="#55625a" text-anchor="middle">Box sensor</text>
  <text x="300" y="560" font-size="13" fill="#55625a" text-anchor="middle">T4 controller probe</text>
</svg>
