# What is growing where: a plant name and a planting date per growing area,
# shown on the dashboard's tent drawing as "Basil · day 12" (or "Empty").
#
# Both are helpers you change in the app (dashboard, "Plants" section, or tap
# the green bubble on a tray): no restart, no file to edit. Home Assistant
# remembers them across restarts. A date left at 1970-01-01 means "not set".
#
# Loaded as a package (configuration.yaml: homeassistant > packages). Changing
# this file needs a Home Assistant restart.

input_text:
  attic_plant_tray_1:
    name: "Tray2Grow 1: plant"
    max: 24
    icon: mdi:sprout
  attic_plant_tray_2:
    name: "Tray2Grow 2: plant"
    max: 24
    icon: mdi:sprout
  attic_plant_area_3:
    name: "Grow area 3: plant"
    max: 24
    icon: mdi:sprout

input_datetime:
  attic_planted_tray_1:
    name: "Tray2Grow 1: planted on"
    has_date: true
    has_time: false
    icon: mdi:calendar-start
  attic_planted_tray_2:
    name: "Tray2Grow 2: planted on"
    has_date: true
    has_time: false
    icon: mdi:calendar-start
  attic_planted_area_3:
    name: "Grow area 3: planted on"
    has_date: true
    has_time: false
    icon: mdi:calendar-start

# The text shown on the drawing: "<plant> · day <days since planting>",
# just "<plant>" without a date, "Empty" without a plant.
template:
  - sensor:
      - name: "Tray2Grow 1 label"
        unique_id: attic_plant_label_tray_1
        icon: mdi:sprout
        state: >-
          {% set name = states('input_text.attic_plant_tray_1') | trim %}
          {% set planted = strptime(states('input_datetime.attic_planted_tray_1'), '%Y-%m-%d', none) %}
          {% if name in ['', 'unknown', 'unavailable'] %}Empty
          {% elif planted is none or planted.year < 2000 %}{{ name }}
          {% else %}{{ name }} · day {{ (now().date() - planted.date()).days }}
          {% endif %}
      - name: "Tray2Grow 2 label"
        unique_id: attic_plant_label_tray_2
        icon: mdi:sprout
        state: >-
          {% set name = states('input_text.attic_plant_tray_2') | trim %}
          {% set planted = strptime(states('input_datetime.attic_planted_tray_2'), '%Y-%m-%d', none) %}
          {% if name in ['', 'unknown', 'unavailable'] %}Empty
          {% elif planted is none or planted.year < 2000 %}{{ name }}
          {% else %}{{ name }} · day {{ (now().date() - planted.date()).days }}
          {% endif %}
      - name: "Grow area 3 label"
        unique_id: attic_plant_label_area_3
        icon: mdi:sprout
        state: >-
          {% set name = states('input_text.attic_plant_area_3') | trim %}
          {% set planted = strptime(states('input_datetime.attic_planted_area_3'), '%Y-%m-%d', none) %}
          {% if name in ['', 'unknown', 'unavailable'] %}Empty
          {% elif planted is none or planted.year < 2000 %}{{ name }}
          {% else %}{{ name }} · day {{ (now().date() - planted.date()).days }}
          {% endif %}
