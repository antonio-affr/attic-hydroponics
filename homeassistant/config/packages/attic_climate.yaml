        device_class: pressure
        state_class: measurement
        icon: mdi:water-thermometer
        availability: "{{ has_value('sensor.tray2grow_2_air_temperature') and has_value('sensor.tray2grow_2_air_humidity') }}"
        state: >-
          {% set t = states('sensor.tray2grow_2_air_temperature') | float %}
          {% set rh = states('sensor.tray2grow_2_air_humidity') | float %}
          {{ (0.61078 * e ** (17.27 * t / (t + 237.3)) * (1 - rh / 100)) | round(2) }}
      - name: Grow area 3 air temperature
        unique_id: attic_climate_grow_area_3_temperature
