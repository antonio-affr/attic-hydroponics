          {% from 'attic.jinja' import find %}{% set e = find('bthome', 'tray2grow2|t2g2|^tray2$', 'sensor', 'humidity') %}
          {{ states(e) | float | round(0) }}
        availability: >-
          {% from 'attic.jinja' import find %}{% set e = find('bthome', 'tray2grow2|t2g2|^tray2$', 'sensor', 'humidity') %}
          {{ has_value(e) and states(e) | is_number }}
      - name: Tray2Grow 2 VPD
        unique_id: attic_climate_tray2grow_2_vpd
