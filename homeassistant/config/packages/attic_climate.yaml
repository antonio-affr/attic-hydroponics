          {{ states(e) | float | round(1) }}
        availability: >-
          {% from 'attic.jinja' import find %}{% set e = find('bthome', 'tray2grow2|t2g2|^tray2$', 'sensor', 'temperature') %}
          {{ has_value(e) and states(e) | is_number }}
      - name: Tray2Grow 2 air humidity
        unique_id: attic_climate_tray2grow_2_humidity
        device_class: humidity
        unit_of_measurement: "%"
        state_class: measurement
