# How much light each growing area gets, as PPFD (µmol/m²/s): the fourth value
# in the row above each tray on the dashboard's tent drawing.
#
# Source: the three BH1750 light sensors on the Arduino Nano, which measure
# lux (sensor.attic_hydroponics_*_illuminance, published by the collector).
# PPFD = lux / 54: a rough figure for white grow LEDs, good for comparing trays
# and noticing a weak or dead light, not a calibrated PAR reading. Change 54
# in all three if a calibrated meter ever says otherwise.
#
# A sensor that is not wired or not answering makes its tray "unavailable".
#
# Loaded as a package (configuration.yaml: homeassistant > packages). Changing
# this file needs a Home Assistant restart.

template:
  - sensor:
      - name: Tray2Grow 1 light
        unique_id: attic_tray_light_tray2grow_1
        icon: mdi:white-balance-sunny
        unit_of_measurement: "PPFD"   # µmol/m²/s; the short name fits the drawing
        state_class: measurement
        state: "{{ (states('sensor.attic_hydroponics_tray2grow_1_illuminance') | float(0) / 54) | round(0) }}"
        availability: "{{ has_value('sensor.attic_hydroponics_tray2grow_1_illuminance') }}"
      - name: Tray2Grow 2 light
        unique_id: attic_tray_light_tray2grow_2
        icon: mdi:white-balance-sunny
        unit_of_measurement: "PPFD"
        state_class: measurement
        state: "{{ (states('sensor.attic_hydroponics_tray2grow_2_illuminance') | float(0) / 54) | round(0) }}"
        availability: "{{ has_value('sensor.attic_hydroponics_tray2grow_2_illuminance') }}"
      - name: Grow area 3 light
        unique_id: attic_tray_light_grow_area_3
        icon: mdi:white-balance-sunny
        unit_of_measurement: "PPFD"
        state_class: measurement
        state: "{{ (states('sensor.attic_hydroponics_grow_area_3_illuminance') | float(0) / 54) | round(0) }}"
        availability: "{{ has_value('sensor.attic_hydroponics_grow_area_3_illuminance') }}"
