# The grow lights' on/off status, shown on the dashboard's tent drawing under
# "Light 1" and "Light 2".
#
# Both read the SwitchBot Plug Mini named "Lights" (MAC ...72:9E), which feeds
# all the tubes, so they always show the same state. The plug is found by its
# device name in Home Assistant (Settings > Devices > SwitchBot Bluetooth; any
# name containing "light" matches, see custom_templates/attic.jinja), so
# renaming its entities never breaks it.
#
# Read-only on purpose: the drawing shows the state but has no switch, so a tap
# never turns the lights off. The "General" plug (...96:7A) is not on the
# dashboard at all: it may feed the Pi itself.
#
# Loaded as a package (configuration.yaml: homeassistant > packages). Changing
# this file needs a Home Assistant restart.

template:
  - sensor:
      - name: Light 1 status
        unique_id: attic_light_1_status
        icon: mdi:led-strip
        state: &plug_state >-
          {% from 'attic.jinja' import find %}
          {% set e = find('switchbot', 'light', 'switch') %}
          {% if e == '' %}plug not found
          {% elif is_state(e, 'on') %}on
          {% elif is_state(e, 'off') %}off
          {% else %}no signal{% endif %}
      - name: Light 2 status
        unique_id: attic_light_2_status
        icon: mdi:led-strip
        state: *plug_state
