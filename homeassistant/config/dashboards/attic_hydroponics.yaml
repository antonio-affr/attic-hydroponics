# "Attic Hydroponics" dashboard. Version-controlled: edit here, then refresh the browser.
# Entity ids come from MQTT Discovery: <device name>_<entity name>, e.g.
# sensor.attic_hydroponics_air_temperature.

title: Attic Hydroponics
views:
  - title: Overview
    path: overview
    icon: mdi:sprout
    type: sections
    max_columns: 3
    sections:
      # --- Current values -------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:sprout
          - type: tile
            entity: sensor.attic_hydroponics_air_temperature
            name: Box temperature
          - type: tile
            entity: sensor.attic_hydroponics_humidity
            name: Box humidity
          - type: tile
            entity: sensor.box_vpd
            name: Box VPD
          - type: tile
            entity: sensor.attic_hydroponics_attic_temperature
            name: Attic temperature
          - type: tile
            entity: sensor.attic_hydroponics_attic_humidity
            name: Attic humidity
          - type: tile
            entity: sensor.attic_hydroponics_reservoir_level
            name: Reservoir level
          - type: tile
            entity: binary_sensor.attic_hydroponics_collector
            name: Collector

      # --- Camera: the latest photo (one every 10 minutes) --------------------
      - type: grid
        cards:
          - type: heading
            heading: Camera
            icon: mdi:camera
          - type: picture-entity
            entity: camera.attic_hydroponics_camera
            camera_view: auto
            show_name: false
            show_state: false
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set ts = state_attr('camera.attic_hydroponics_camera', 'timestamp') %}
              Last photo: **{{ as_timestamp(ts) | timestamp_custom('%d %b, %H:%M') if ts else 'none yet' }}**.
              NoIR camera: pinkish colours are normal.

      # --- Status: online/offline and last update ---------------------------
      - type: grid
        cards:
          - type: heading
            heading: Status
            icon: mdi:access-point-network
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.attic_hydroponics_collector
                name: Collector
                secondary_info: last-changed
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box temperature
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_humidity
                name: Box humidity
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic temperature
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic humidity
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Reservoir level
                secondary_info: last-updated
          - type: markdown
            grid_options:
              columns: full
            content: >-
              A sensor shows **Unavailable** when no reading arrived for 2.5 ×
              the reading interval, or when the collector is disconnected.

      # --- History ----------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-line
          - type: history-graph
            title: Temperature, box vs attic, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic
          - type: history-graph
            title: Humidity, box vs attic, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_humidity
                name: Box
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic
          - type: history-graph
            title: Box VPD (kPa), last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.box_vpd
                name: VPD
          - type: markdown
            grid_options:
              columns: 12
            content: >-
              **VPD** (vapour pressure deficit) is how strongly the air pulls
              water from the leaves, computed from the box temperature and
              humidity. Usual targets: seedlings and clones **0.4 to 0.8 kPa**,
              vegetative growth **0.8 to 1.2 kPa**, flowering **1.2 to 1.6 kPa**.
              Too low: slow growth and mould risk. Too high: the plants close up
              and stress. Lower it by raising humidity or lowering temperature.
          - type: history-graph
            title: Reservoir level, last 7 days
            hours_to_show: 168
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Reservoir level
          - type: statistics-graph
            title: Temperature, daily min / average / max (7 days)
            period: day
            days_to_show: 7
            chart_type: line
            stat_types: [min, mean, max]
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic
          - type: statistics-graph
            title: Humidity, daily min / average / max (7 days)
            period: day
            days_to_show: 7
            chart_type: line
            stat_types: [min, mean, max]
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_humidity
                name: Box
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic
