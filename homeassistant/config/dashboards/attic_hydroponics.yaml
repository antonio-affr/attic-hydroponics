# "Attic Hydroponics" dashboard. Version-controlled: edit here, then refresh the browser.
# Entity ids come from MQTT Discovery: <device name>_<entity name>, e.g.
# sensor.attic_hydroponics_air_temperature.

title: Attic Hydroponics
views:
  # Tab 1: the tent drawing and the plants. The app opens here.
  - title: Tent
    path: tent
    type: sections
    max_columns: 2
    sections:
      # --- Tent: live values on top of the tent drawing ------------------------
      # Background: homeassistant/config/www/attic_tent.svg, served as /local/.
      # Positions are percentages of the drawing: left = x / 600, top = y / 890.
      # Bump ?v= in the image URL after editing the SVG, or browsers keep the old one.
      - type: grid
        cards:
          - type: heading
            heading: Tent
            icon: mdi:tent
          - type: picture-elements
            image: /local/attic_tent.svg?v=7
            grid_options:
              columns: full
            elements:
              # Values: plain coloured text, no frame (temperature orange,
              # humidity blue, VPD green, water cyan). Attic, outside the tent
              # (the "Outside" Xiaomi, packages/attic_climate.yaml):
              - &value
                type: state-label
                entity: sensor.attic_outside_air_temperature
                style: &text
                  left: 55%
                  top: 5.1%
                  color: "#ffb38a"
                  font-size: 12px
                  font-weight: 600
                  white-space: nowrap
                  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9)
              - <<: *value
                entity: sensor.attic_outside_air_humidity
                style: {<<: *text, left: 73.3%, color: "#8fd3ff"}
              - type: state-icon
                entity: binary_sensor.attic_hydroponics_collector
                style: {left: 93.3%, top: 5.1%}

              # Tank 1 (the reservoir level sensor; Tank 2 has none yet), and
              # the water temperature probe on the Nano below it
              - <<: *value
                entity: sensor.attic_hydroponics_reservoir_level
                style: {<<: *text, left: 25%, top: 26.1%, color: "#6fdcff"}
              - <<: *value
                entity: sensor.attic_hydroponics_water_temperature
                style: {<<: *text, left: 25%, top: 28.4%, font-size: 10.5px, color: "#ffb38a"}

              # T4 fan: icon, yellow when running (tap for speed and on/off),
              # and the speed below it
              - type: state-icon
                entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
                style: {left: 80%, top: 20.2%, transform: "translate(-50%, -50%) scale(1.4)"}
              - <<: *value
                entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
                attribute: percentage
                suffix: " %"
                style: {<<: *text, left: 80%, top: 24.7%, color: "#e8f0f2"}

              # Lights on/off, under the "LIGHT 1" / "LIGHT 2" labels: the
              # "Lights" SwitchBot plug, read-only (packages/attic_lights.yaml)
              - <<: *value
                entity: sensor.light_1_status
                style: &light
                  <<: *text
                  left: 85%
                  top: 36.2%
                  color: "#7f8f98"
                  font-size: 9.5px
                  letter-spacing: 1px
                  text-transform: uppercase
              - <<: *value
                entity: sensor.light_2_status
                style: {<<: *light, top: 57.5%}

              # Each tray's own Xiaomi thermometer (packages/attic_climate.yaml):
              # temperature, humidity, VPD, then the light further right. The
              # box sensor and the T4 controller probe are in the Stats tab.
              - <<: *value
                entity: sensor.tray2grow_1_air_temperature
                style: &rowtemp {<<: *text, left: 29%, top: 39.9%, font-size: 10.5px}
              - <<: *value
                entity: sensor.tray2grow_1_air_humidity
                style: &rowhum {<<: *text, left: 43%, top: 39.9%, font-size: 10.5px, color: "#8fd3ff"}
              - <<: *value
                entity: sensor.tray2grow_1_vpd
                style: &rowvpd {<<: *text, left: 57%, top: 39.9%, font-size: 10.5px, color: "#a5e8b0"}

              - <<: *value
                entity: sensor.tray2grow_2_air_temperature
                style: {<<: *rowtemp, top: 61.2%}
              - <<: *value
                entity: sensor.tray2grow_2_air_humidity
                style: {<<: *rowhum, top: 61.2%}
              - <<: *value
                entity: sensor.tray2grow_2_vpd
                style: {<<: *rowvpd, top: 61.2%}

              - <<: *value
                entity: sensor.grow_area_3_air_temperature
                style: {<<: *rowtemp, top: 82.6%}
              - <<: *value
                entity: sensor.grow_area_3_air_humidity
                style: {<<: *rowhum, top: 82.6%}
              - <<: *value
                entity: sensor.grow_area_3_vpd
                style: {<<: *rowvpd, top: 82.6%}

              # What grows on each tray (packages/attic_plants.yaml), wrapped
              # inside the green tray
              - <<: *value
                entity: sensor.tray2grow_1_plants
                style: &plants
                  <<: *text
                  left: 48.3%
                  top: 50%
                  width: 70%
                  color: "#d4f2dc"
                  font-size: 10px
                  line-height: 1.3
                  text-align: center
                  white-space: normal
              - <<: *value
                entity: sensor.tray2grow_2_plants
                style: {<<: *plants, top: 71.3%}
              - <<: *value
                entity: sensor.grow_area_3_plants
                style: {<<: *plants, top: 92.7%}

              # Light on each tray (packages/attic_tray_light.yaml), fourth in
              # each tray's row
              - <<: *value
                entity: sensor.tray2grow_1_light
                style: &traylight {<<: *text, left: 71%, top: 39.9%, font-size: 10.5px, color: "#ffe08a"}
              - <<: *value
                entity: sensor.tray2grow_2_light
                style: {<<: *traylight, top: 61.2%}
              - <<: *value
                entity: sensor.grow_area_3_light
                style: {<<: *traylight, top: 82.6%}

      # --- Plants: what grows where (packages/attic_plants.yaml) ---------------
      - type: grid
        cards:
          - type: heading
            heading: Plants
            icon: mdi:sprout
          - type: entities
            title: Add a plant
            grid_options:
              columns: full
            entities:
              - entity: input_text.attic_new_plant_name
                name: Name
              - entity: input_datetime.attic_new_plant_planted
                name: Planted on
              - entity: input_select.attic_new_plant_area
                name: Area
              - type: button
                name: Add plant
                icon: mdi:plus
                action_name: Add
                tap_action:
                  action: perform-action
                  perform_action: script.attic_plant_add
          - type: entities
            title: Remove a plant
            grid_options:
              columns: full
            entities:
              - entity: input_select.attic_plant_to_remove
                name: Plant
              - type: button
                name: Remove plant
                icon: mdi:delete
                action_name: Remove
                tap_action:
                  action: perform-action
                  perform_action: script.attic_plant_remove
                  confirmation:
                    text: Remove this plant from the list?
          - type: markdown
            grid_options:
              columns: full
            content: |
              {% set all = state_attr('sensor.attic_plants', 'plants') or [] %}
              {% for area in ['Tray2Grow 1', 'Tray2Grow 2', 'Grow area 3'] %}
              **{{ area }}**
              {% for p in all | selectattr('area', 'eq', area) | sort(attribute='planted') %}
              - {{ p.name }}: planted {{ strptime(p.planted, '%Y-%m-%d').strftime('%d %b %Y') }}, day {{ (now().date() - strptime(p.planted, '%Y-%m-%d').date()).days }}
              {% else %}
              - *No plants*
              {% endfor %}
              {% endfor %}

              To correct a plant, remove it and add it again. With no date
              picked, a new plant counts as planted today.

  # Tab 2: everything in numbers, one section per part of the setup.
  - title: Stats
    path: stats
    type: sections
    max_columns: 3
    sections:
      # --- Electric: the General plug and the grow lights (packages/attic_electric.yaml)
      - type: grid
        cards:
          - type: heading
            heading: Electric
            icon: mdi:flash
          - type: tile
            entity: sensor.electric_power
            name: Power now
          - type: tile
            entity: sensor.electric_cost_today
            name: Cost today
          - type: tile
            entity: sensor.electric_energy_today
            name: Energy today
          - type: tile
            entity: sensor.electric_cost_this_month
            name: Cost this month
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: input_number.attic_electricity_price
                name: Price per kWh (from the bill)
              - entity: sensor.electric_voltage
                name: Voltage
              - entity: sensor.electric_current
                name: Current
          - type: tile
            entity: sensor.light_1_status
            name: Grow lights
            icon: mdi:led-strip
          - type: tile
            entity: sensor.grow_lights_power
            name: Grow lights power
          - type: history-graph
            title: Lights schedule (on / off) and power, last 48 hours
            hours_to_show: 48
            grid_options:
              columns: full
            entities:
              - entity: sensor.light_1_status
                name: Grow lights
              - entity: sensor.electric_power
                name: Whole setup
              - entity: sensor.grow_lights_power
                name: Grow lights
          - type: statistics-graph
            title: Energy per day (kWh), last 14 days
            period: day
            days_to_show: 14
            chart_type: bar
            stat_types: [change]
            grid_options:
              columns: full
            entities:
              - entity: sensor.electric_energy
                name: Whole setup
          - type: markdown
            grid_options:
              columns: full
            content: >-
              Read from the **General** plug, which feeds everything, and the
              **Lights** plug. The cost is the energy used today (or this
              month) times the price above: set it once from the electricity
              bill. Neither plug can be switched from here, on purpose.

      # --- Outside: the attic around the tent, and the camera ---------------
      - type: grid
        cards:
          - type: heading
            heading: Outside
            icon: mdi:home-roof
          - type: tile
            entity: sensor.attic_outside_air_temperature
            name: Temperature
          - type: tile
            entity: sensor.attic_outside_air_humidity
            name: Humidity
          - type: history-graph
            title: Attic, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.attic_outside_air_temperature
                name: Temperature
              - entity: sensor.attic_outside_air_humidity
                name: Humidity
          - type: statistics-graph
            title: Attic temperature, daily min / average / max (7 days)
            period: day
            days_to_show: 7
            chart_type: line
            stat_types: [min, mean, max]
            grid_options:
              columns: full
            entities:
              - entity: sensor.attic_outside_air_temperature
                name: Attic
          - type: picture-entity
            entity: camera.attic_hydroponics_camera
            camera_view: auto
            show_name: false
            show_state: false
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set ts = state_attr('camera.attic_hydroponics_camera', 'timestamp') %}
              Last photo: **{{ as_timestamp(ts) | timestamp_custom('%d %b, %H:%M') if ts else 'none yet' }}**
              (one every 10 minutes). NoIR camera: pinkish colours are normal.

      # --- Fan: the T4 and its AC Infinity Controller 69 Pro (Bluetooth, Pi only)
      # Entities come from the ac_infinity integration (REAL_SENSORS.md part 9c);
      # on the laptop they do not exist and the cards show "not available".
      - type: grid
        cards:
          - type: heading
            heading: Fan
            icon: mdi:fan
          - type: tile
            entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
            name: T4 fan
            grid_options:
              columns: full
            features:
              - type: fan-speed
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_temperature
            name: Controller temperature
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_humidity
            name: Controller humidity
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_vpd
            name: Controller VPD
          - type: history-graph
            title: Fan and controller probe, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
                name: T4 fan
              - entity: sensor.attic_controller_69_pro_g_sp7n7_temperature
                name: Temperature
              - entity: sensor.attic_controller_69_pro_g_sp7n7_humidity
                name: Humidity
              - entity: sensor.attic_controller_69_pro_g_sp7n7_vpd
                name: VPD
          - type: markdown
            grid_options:
              columns: full
            content: >-
              Read from the controller's own probe over Bluetooth. Turning the
              fan **off** keeps the controller's saved minimum speed, so it may
              still turn slowly. The controller keeps running its own program
              if the Pi is off.

      # --- Water tanks: level and temperature --------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Water tanks
            icon: mdi:water
          - type: tile
            entity: sensor.attic_hydroponics_reservoir_level
            name: Tank 1 level
          - type: tile
            entity: sensor.attic_hydroponics_water_temperature
            name: Tank 1 water temperature
          - type: history-graph
            title: Tank 1, last 7 days
            hours_to_show: 168
            grid_options:
              columns: full
            entities:
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Level
              - entity: sensor.attic_hydroponics_water_temperature
                name: Water temperature
          - type: markdown
            grid_options:
              columns: full
            content: >-
              The water temperature comes from the probe on the Nano. The level
              is still simulated until the tank height sensor is fitted; Tank 2
              has no sensors yet. Nutrient water is best at **18 to 22 °C**:
              warmer holds less oxygen and invites root rot.

      # --- One section per growing area (packages/attic_climate.yaml and
      # packages/attic_tray_light.yaml) ---------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Tray2Grow 1
            icon: mdi:sprout
          - type: tile
            entity: sensor.tray2grow_1_air_temperature
            name: Temperature
          - type: tile
            entity: sensor.tray2grow_1_air_humidity
            name: Humidity
          - type: tile
            entity: sensor.tray2grow_1_vpd
            name: VPD
          - type: tile
            entity: sensor.tray2grow_1_light
            name: Light
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.tray2grow_1_air_temperature
                name: Temperature
              - entity: sensor.tray2grow_1_air_humidity
                name: Humidity
              - entity: sensor.tray2grow_1_vpd
                name: VPD
              - entity: sensor.tray2grow_1_light
                name: Light
      - type: grid
        cards:
          - type: heading
            heading: Tray2Grow 2
            icon: mdi:sprout
          - type: tile
            entity: sensor.tray2grow_2_air_temperature
            name: Temperature
          - type: tile
            entity: sensor.tray2grow_2_air_humidity
            name: Humidity
          - type: tile
            entity: sensor.tray2grow_2_vpd
            name: VPD
          - type: tile
            entity: sensor.tray2grow_2_light
            name: Light
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.tray2grow_2_air_temperature
                name: Temperature
              - entity: sensor.tray2grow_2_air_humidity
                name: Humidity
              - entity: sensor.tray2grow_2_vpd
                name: VPD
              - entity: sensor.tray2grow_2_light
                name: Light
      - type: grid
        cards:
          - type: heading
            heading: Grow area 3
            icon: mdi:sprout
          - type: tile
            entity: sensor.grow_area_3_air_temperature
            name: Temperature
          - type: tile
            entity: sensor.grow_area_3_air_humidity
            name: Humidity
          - type: tile
            entity: sensor.grow_area_3_vpd
            name: VPD
          - type: tile
            entity: sensor.grow_area_3_light
            name: Light
          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            grid_options:
              columns: full
            entities:
              - entity: sensor.grow_area_3_air_temperature
                name: Temperature
              - entity: sensor.grow_area_3_air_humidity
                name: Humidity
              - entity: sensor.grow_area_3_vpd
                name: VPD
              - entity: sensor.grow_area_3_light
                name: Light
      - type: grid
        cards:
          - type: heading
            heading: Reading the tray numbers
            icon: mdi:information-outline
          - type: markdown
            grid_options:
              columns: full
            content: >-
              **VPD** (vapour pressure deficit, kPa) is how strongly the air
              pulls water from the leaves, from each tray's temperature and
              humidity. Seedlings and clones **0.4 to 0.8**, vegetative growth
              **0.8 to 1.2**, flowering **1.2 to 1.6**. Too low: slow growth and
              mould risk; too high: the plants close up and stress.


              **Light** is PPFD (µmol/m²/s), estimated from the light sensors'
              lux (lux / 54, roughly ±20 %). Leafy greens want **200 to 400**
              while the lights are on. A tray far below the others under the
              same lights means a weak light or a sensor that has moved.

      # --- Alerts and their thresholds (packages/attic_alerts.yaml) ----------
      - type: grid
        cards:
          - type: heading
            heading: Alerts and thresholds
            icon: mdi:bell-alert
          - type: entities
            title: Alerts now
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.box_temperature_alert
                name: Box temperature
                secondary_info: last-changed
              - entity: binary_sensor.box_humidity_alert
                name: Box humidity
                secondary_info: last-changed
              - entity: binary_sensor.box_vpd_alert
                name: Box VPD
                secondary_info: last-changed
              - entity: binary_sensor.collector_alert
                name: Collector
                secondary_info: last-changed
              - entity: binary_sensor.camera_alert
                name: Camera
                secondary_info: last-changed
          - type: entities
            title: Thresholds (tap a value to change it)
            grid_options:
              columns: full
            entities:
              - entity: input_number.attic_alert_temperature_min
                name: Temperature, alert below
              - entity: input_number.attic_alert_temperature_max
                name: Temperature, alert above
              - entity: input_number.attic_alert_humidity_min
                name: Humidity, alert below
              - entity: input_number.attic_alert_humidity_max
                name: Humidity, alert above
              - entity: input_number.attic_alert_vpd_min
                name: VPD, alert below
              - entity: input_number.attic_alert_vpd_max
                name: VPD, alert above
              - entity: input_number.attic_alert_delay_minutes
                name: Alert after (minutes)
              - type: button
                name: Back to the default thresholds
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: script.attic_alerts_default_thresholds
                  confirmation:
                    text: Set every threshold back to its default?
          - type: markdown
            grid_options:
              columns: full
            content: >-
              A notification is sent when a value stays out of range for the
              "alert after" time, and again when it is back (5 minutes in
              range). The temperature, humidity and VPD alerts watch the box
              sensor. To get alerts during Do Not Disturb, allow the phone's
              **Attic alerts** notification category through it.

      # --- System: is everything reporting? ----------------------------------
      - type: grid
        cards:
          - type: heading
            heading: System
            icon: mdi:access-point-network
          - type: tile
            entity: binary_sensor.attic_hydroponics_collector
            name: Collector
            grid_options:
              columns: full
          - type: entities
            title: Last reading from each sensor
            grid_options:
              columns: full
            entities:
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box sensor (Grove), temperature
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_humidity
                name: Box sensor (Grove), humidity
                secondary_info: last-updated
              - entity: sensor.box_vpd
                name: Box sensor (Grove), VPD
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_water_temperature
                name: Water temperature (Nano)
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_tray2grow_1_illuminance
                name: Tray2Grow 1 light (Nano)
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_tray2grow_2_illuminance
                name: Tray2Grow 2 light (Nano)
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_grow_area_3_illuminance
                name: Grow area 3 light (Nano)
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Tank 1 level (simulated)
                secondary_info: last-updated
          - type: entities
            title: Thermometer batteries
            grid_options:
              columns: full
            entities:
              - entity: sensor.tray2grow_1_thermometer_battery
                name: Tray2Grow 1
              - entity: sensor.tray2grow_2_thermometer_battery
                name: Tray2Grow 2
              - entity: sensor.grow_area_3_thermometer_battery
                name: Grow area 3
              - entity: sensor.attic_outside_thermometer_battery
                name: Attic (outside)
          - type: markdown
            grid_options:
              columns: full
            content: >-
              A collector sensor shows **Unavailable** when no reading arrived
              for 2.5 × the reading interval (75 s on the Pi), or when the
              collector is disconnected. The thermometers send a reading every
              10 seconds on their own.
