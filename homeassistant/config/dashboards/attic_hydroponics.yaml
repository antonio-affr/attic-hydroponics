# "Attic Hydroponics" dashboard. Version-controlled: edit here, then refresh the browser.
# Entity ids come from MQTT Discovery: <device name>_<entity name>, e.g.
# sensor.attic_hydroponics_air_temperature.

title: Attic Hydroponics
views:
  - title: Overview
    path: overview
    icon: mdi:sprout
    type: sections
    max_columns: 3
    sections:
      # --- Tent: live values on top of the tent drawing ------------------------
      # Background: homeassistant/config/www/attic_tent.svg, served as /local/.
      # Positions are percentages of the drawing: left = x / 600, top = y / 890.
      # Bump ?v= in the image URL after editing the SVG, or browsers keep the old one.
      - type: grid
        cards:
          - type: heading
            heading: Tent
            icon: mdi:tent
          - type: picture-elements
            image: /local/attic_tent.svg?v=5
            grid_options:
              columns: full
            elements:
              # Value bubbles: frosted glass, coloured by kind
              # (temperature orange, humidity blue, VPD green, water cyan).
              # Attic, outside the tent
              - &value
                type: state-label
                entity: sensor.attic_hydroponics_attic_temperature
                style: &chip
                  left: 55%
                  top: 5.1%
                  color: "#ffb38a"
                  background: rgba(10, 16, 20, 0.72)
                  border: 1px solid rgba(255, 255, 255, 0.14)
                  backdrop-filter: blur(6px)
                  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35)
                  border-radius: 999px
                  padding: 2px 10px
                  font-size: 14px
                  font-weight: 600
                  white-space: nowrap
              - <<: *value
                entity: sensor.attic_hydroponics_attic_humidity
                style: {<<: *chip, left: 73.3%, color: "#8fd3ff"}
              - type: state-icon
                entity: binary_sensor.attic_hydroponics_collector
                style: {left: 93.3%, top: 5.1%}

              # Tank 1 (the reservoir level sensor; Tank 2 has none yet)
              - <<: *value
                entity: sensor.attic_hydroponics_reservoir_level
                style: {<<: *chip, left: 25%, top: 27.5%, color: "#6fdcff"}

              # T4 fan: icon (tap for speed and on/off), then the speed
              - type: state-icon
                entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
                style: {left: 80%, top: 21.3%, transform: "translate(-50%, -50%) scale(1.6)"}
              - <<: *value
                entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
                attribute: percentage
                suffix: " %"
                style: {<<: *chip, left: 80%, top: 26.1%, color: "#e8f0f2"}

              # Box sensor (SHT3x), between light 1 and tray 1
              - <<: *value
                entity: sensor.attic_hydroponics_air_temperature
                style: {<<: *chip, left: 31.7%, top: 41.8%}
              - <<: *value
                entity: sensor.attic_hydroponics_humidity
                style: {<<: *chip, left: 50%, top: 41.8%, color: "#8fd3ff"}
              - <<: *value
                entity: sensor.box_vpd
                style: {<<: *chip, left: 68.3%, top: 41.8%, color: "#a5e8b0"}

              # T4 controller probe, between light 2 and tray 2
              - <<: *value
                entity: sensor.attic_controller_69_pro_g_sp7n7_temperature
                style: {<<: *chip, left: 31.7%, top: 61.6%}
              - <<: *value
                entity: sensor.attic_controller_69_pro_g_sp7n7_humidity
                style: {<<: *chip, left: 50%, top: 61.6%, color: "#8fd3ff"}
              - <<: *value
                entity: sensor.attic_controller_69_pro_g_sp7n7_vpd
                style: {<<: *chip, left: 68.3%, top: 61.6%, color: "#a5e8b0"}

              # What is growing, two plants per area, left and right as seen from
              # the front (packages/attic_plants.yaml). Tap a bubble to rename the
              # plant; the planting dates are in the "Plants" section. A name too
              # long for the bubble ends in "...".
              - &plant
                type: state-label
                entity: sensor.tray2grow_1_left_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_tray_1_left
                style: &plant_chip
                  <<: *chip
                  left: 28%
                  top: 46%
                  color: "#b7e6c4"
                  background: rgba(16, 36, 24, 0.85)
                  border: 1px solid rgba(111, 224, 139, 0.35)
                  font-size: 12px
                  padding: 1px 8px
                  max-width: 40%
                  overflow: hidden
                  text-overflow: ellipsis
              - <<: *plant
                entity: sensor.tray2grow_1_right_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_tray_1_right
                style: {<<: *plant_chip, left: 70%, top: 46%}
              - <<: *plant
                entity: sensor.tray2grow_2_left_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_tray_2_left
                style: {<<: *plant_chip, left: 28%, top: 68%}
              - <<: *plant
                entity: sensor.tray2grow_2_right_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_tray_2_right
                style: {<<: *plant_chip, left: 70%, top: 68%}
              - <<: *plant
                entity: sensor.grow_area_3_left_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_area_3_left
                style: {<<: *plant_chip, left: 28%, top: 89.6%}
              - <<: *plant
                entity: sensor.grow_area_3_right_label
                tap_action:
                  action: more-info
                  entity: input_text.attic_plant_area_3_right
                style: {<<: *plant_chip, left: 70%, top: 89.6%}

      # --- Plants: what is growing where (packages/attic_plants.yaml) ---------
      - type: grid
        cards:
          - type: heading
            heading: Plants
            icon: mdi:sprout
          - type: entities
            title: Tray2Grow 1
            grid_options:
              columns: full
            entities:
              - entity: input_text.attic_plant_tray_1_left
                name: Left
              - entity: input_datetime.attic_planted_tray_1_left
                name: Left, planted on
              - entity: input_text.attic_plant_tray_1_right
                name: Right
              - entity: input_datetime.attic_planted_tray_1_right
                name: Right, planted on
          - type: entities
            title: Tray2Grow 2
            grid_options:
              columns: full
            entities:
              - entity: input_text.attic_plant_tray_2_left
                name: Left
              - entity: input_datetime.attic_planted_tray_2_left
                name: Left, planted on
              - entity: input_text.attic_plant_tray_2_right
                name: Right
              - entity: input_datetime.attic_planted_tray_2_right
                name: Right, planted on
          - type: entities
            title: Grow area 3
            grid_options:
              columns: full
            entities:
              - entity: input_text.attic_plant_area_3_left
                name: Left
              - entity: input_datetime.attic_planted_area_3_left
                name: Left, planted on
              - entity: input_text.attic_plant_area_3_right
                name: Right
              - entity: input_datetime.attic_planted_area_3_right
                name: Right, planted on
          - type: markdown
            grid_options:
              columns: full
            content: >-
              Two plants per area, **left** and **right** as seen from the front
              of the tent. Type the plant's name and pick the day it was planted:
              the tent drawing shows **"Basil · day 12"**. Clear the name when
              the plant is harvested. No date needed: then it shows only the name.

      # --- Current values -------------------------------------------------
      - type: grid
        cards:
          - type: heading
            heading: Right now
            icon: mdi:sprout
          - type: tile
            entity: sensor.attic_hydroponics_air_temperature
            name: Box temperature
          - type: tile
            entity: sensor.attic_hydroponics_humidity
            name: Box humidity
          - type: tile
            entity: sensor.box_vpd
            name: Box VPD
          - type: tile
            entity: sensor.attic_hydroponics_attic_temperature
            name: Attic temperature
          - type: tile
            entity: sensor.attic_hydroponics_attic_humidity
            name: Attic humidity
          - type: tile
            entity: sensor.attic_hydroponics_reservoir_level
            name: Reservoir level
          - type: tile
            entity: binary_sensor.attic_hydroponics_collector
            name: Collector

      # --- T4 fan: the AC Infinity Controller 69 Pro, over Bluetooth (Pi only) --
      # Entities come from the ac_infinity integration (REAL_SENSORS.md part 9c);
      # on the laptop they do not exist and the cards show "not available".
      - type: grid
        cards:
          - type: heading
            heading: T4 fan
            icon: mdi:fan
          - type: tile
            entity: fan.attic_controller_69_pro_g_sp7n7_port_1_fan
            name: T4 fan
            grid_options:
              columns: full
            features:
              - type: fan-speed
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_temperature
            name: Controller temperature
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_humidity
            name: Controller humidity
          - type: tile
            entity: sensor.attic_controller_69_pro_g_sp7n7_vpd
            name: Controller VPD
          - type: markdown
            grid_options:
              columns: full
            content: >-
              Read from the controller's own probe over Bluetooth. Turning the
              fan **off** keeps the controller's saved minimum speed, so it may
              still turn slowly. The controller keeps running its own program
              if the Pi is off.

      # --- Camera: the latest photo (one every 10 minutes) --------------------
      - type: grid
        cards:
          - type: heading
            heading: Camera
            icon: mdi:camera
          - type: picture-entity
            entity: camera.attic_hydroponics_camera
            camera_view: auto
            show_name: false
            show_state: false
            grid_options:
              columns: full
          - type: markdown
            grid_options:
              columns: full
            content: >-
              {% set ts = state_attr('camera.attic_hydroponics_camera', 'timestamp') %}
              Last photo: **{{ as_timestamp(ts) | timestamp_custom('%d %b, %H:%M') if ts else 'none yet' }}**.
              NoIR camera: pinkish colours are normal.

      # --- Status: online/offline and last update ---------------------------
      - type: grid
        cards:
          - type: heading
            heading: Status
            icon: mdi:access-point-network
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.attic_hydroponics_collector
                name: Collector
                secondary_info: last-changed
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box temperature
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_humidity
                name: Box humidity
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic temperature
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic humidity
                secondary_info: last-updated
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Reservoir level
                secondary_info: last-updated
          - type: markdown
            grid_options:
              columns: full
            content: >-
              A sensor shows **Unavailable** when no reading arrived for 2.5 ×
              the reading interval, or when the collector is disconnected.

      # --- Alerts: current state and editable thresholds (packages/attic_alerts.yaml)
      - type: grid
        cards:
          - type: heading
            heading: Alerts
            icon: mdi:bell-alert
          - type: entities
            grid_options:
              columns: full
            entities:
              - entity: binary_sensor.box_temperature_alert
                name: Box temperature
                secondary_info: last-changed
              - entity: binary_sensor.box_humidity_alert
                name: Box humidity
                secondary_info: last-changed
              - entity: binary_sensor.box_vpd_alert
                name: Box VPD
                secondary_info: last-changed
              - entity: binary_sensor.collector_alert
                name: Collector
                secondary_info: last-changed
              - entity: binary_sensor.camera_alert
                name: Camera
                secondary_info: last-changed
          - type: entities
            title: Thresholds (tap a value to change it)
            grid_options:
              columns: full
            entities:
              - entity: input_number.attic_alert_temperature_min
                name: Temperature, alert below
              - entity: input_number.attic_alert_temperature_max
                name: Temperature, alert above
              - entity: input_number.attic_alert_humidity_min
                name: Humidity, alert below
              - entity: input_number.attic_alert_humidity_max
                name: Humidity, alert above
              - entity: input_number.attic_alert_vpd_min
                name: VPD, alert below
              - entity: input_number.attic_alert_vpd_max
                name: VPD, alert above
              - entity: input_number.attic_alert_delay_minutes
                name: Alert after (minutes)
              - type: button
                name: Back to the default thresholds
                icon: mdi:restore
                action_name: Reset
                tap_action:
                  action: perform-action
                  perform_action: script.attic_alerts_default_thresholds
                  confirmation:
                    text: Set every threshold back to its default?
          - type: markdown
            grid_options:
              columns: full
            content: >-
              A notification is sent when a value stays out of range for the
              "alert after" time, and again when it is back (5 minutes in
              range). To get alerts during Do Not Disturb, allow the phone's
              **Attic alerts** notification category through it.

      # --- History ----------------------------------------------------------
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: History
            icon: mdi:chart-line
          - type: history-graph
            title: Temperature, box vs attic vs T4 controller, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic
              - entity: sensor.attic_controller_69_pro_g_sp7n7_temperature
                name: T4 controller
          - type: history-graph
            title: Humidity, box vs attic vs T4 controller, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_humidity
                name: Box
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic
              - entity: sensor.attic_controller_69_pro_g_sp7n7_humidity
                name: T4 controller
          - type: history-graph
            title: VPD (kPa), box vs T4 controller, last 24 hours
            hours_to_show: 24
            grid_options:
              columns: 12
            entities:
              - entity: sensor.box_vpd
                name: Box
              - entity: sensor.attic_controller_69_pro_g_sp7n7_vpd
                name: T4 controller
          - type: markdown
            grid_options:
              columns: 12
            content: >-
              **VPD** (vapour pressure deficit) is how strongly the air pulls
              water from the leaves, computed from the box temperature and
              humidity. Usual targets: seedlings and clones **0.4 to 0.8 kPa**,
              vegetative growth **0.8 to 1.2 kPa**, flowering **1.2 to 1.6 kPa**.
              Too low: slow growth and mould risk. Too high: the plants close up
              and stress. Lower it by raising humidity or lowering temperature.
          - type: history-graph
            title: Reservoir level, last 7 days
            hours_to_show: 168
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_reservoir_level
                name: Reservoir level
          - type: statistics-graph
            title: Temperature, daily min / average / max (7 days)
            period: day
            days_to_show: 7
            chart_type: line
            stat_types: [min, mean, max]
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_air_temperature
                name: Box
              - entity: sensor.attic_hydroponics_attic_temperature
                name: Attic
          - type: statistics-graph
            title: Humidity, daily min / average / max (7 days)
            period: day
            days_to_show: 7
            chart_type: line
            stat_types: [min, mean, max]
            grid_options:
              columns: 12
            entities:
              - entity: sensor.attic_hydroponics_humidity
                name: Box
              - entity: sensor.attic_hydroponics_attic_humidity
                name: Attic
